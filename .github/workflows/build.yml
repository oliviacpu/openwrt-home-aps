name: Build firmware

on:
  schedule:
    - cron: '23 9 * * *'          # daily: pick up new OpenWrt releases and package updates
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if nothing changed since the last release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - 'packages/**'
      - 'devices/**'
      - 'build/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.decide.outputs.version }}
      serial: ${{ steps.decide.outputs.serial }}
      key: ${{ steps.decide.outputs.key }}
      devices: ${{ steps.decide.outputs.devices }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to build
        id: decide
        run: build/decide.sh "${{ inputs.force || 'false' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        profile: ${{ fromJSON(needs.decide.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
      - name: Build and verify ${{ matrix.profile }}
        run: build/build.sh "${{ matrix.profile }}" "${{ needs.decide.outputs.version }}" "${{ needs.decide.outputs.serial }}" "out/${{ matrix.profile }}"
      - name: Keep image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.profile }}
          path: out/${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: artifacts
      - name: Check versions, sign, publish
        env:
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: build/publish.sh "${{ needs.decide.outputs.version }}" "${{ needs.decide.outputs.serial }}" "${{ needs.decide.outputs.key }}" artifacts "${{ inputs.force || 'false' }}"
