# Netgear WAX214v2 access point ("Spiderweb"), 1x GbE + PoE, MT7621 + MT7915.
PROFILE=netgear_wax214v2
TARGET=ramips/mt7621
AP_ID=netgear            # /etc/ap-id: shell prompt host, ha-mqtt node_id (must match its MQTT user)
GOARCH=mipsle
GOMIPS=softfloat         # the 1004Kc cores have no FPU
INSTALL_HOUR=4           # automatic installs; staggered against the other AP
FACTORY_IMAGE=1          # also publish *-squashfs-factory.img (stock-firmware / nmrpflash recovery)
IMAGE_MAX_BYTES=39845888  # firmware partition (kernel + ubi)
