# GL.iNet GL-MT3000 "Beryl AX": bedroom access point at home, travel router away (side switch).
# MT7981 (Wi-Fi 6, 2x2), 2.5G (eth0) + 1G (eth1) Ethernet, fan, USB 3.0 (ASUS BT400 over USB/IP).
PROFILE=glinet_gl-mt3000
TARGET=mediatek/filogic
AP_ID=beryl              # /etc/ap-id: shell prompt host, ha-mqtt node_id (must match its MQTT user)
GOARCH=arm64             # Cortex-A53
GOMIPS=''
INSTALL_HOUR=5           # automatic installs, staggered against the Netgear's 4; Home only (inhibit.d/40-away)
FACTORY_IMAGE=0          # no stock-firmware recovery image; recovery is GL's U-Boot web UI (hold reset at power-on)
IMAGE_MAX_BYTES=67108864  # 64 MiB, far under the 245 MiB UBI partition, so the overlay keeps most of the flash
